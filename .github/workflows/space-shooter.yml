name: Update Space Shooter Game
on:
  schedule:
    - cron: '0 0 * * *'  # Setiap hari tengah malam UTC
  workflow_dispatch:      # Memungkinkan trigger manual

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2  # Penting untuk fitur amend commit

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'  # Pilihan: column, row, atau random
